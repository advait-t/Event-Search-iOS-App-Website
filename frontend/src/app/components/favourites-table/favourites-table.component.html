<section class="saved-events" aria-labelledby="favorites-heading">
  <h1 id="favorites-heading">Favorites</h1>
  <p *ngIf="error" role="alert">{{ error }}</p>
  <p *ngIf="!data.length" class="empty">Save an event with the heart button and it’ll show up here.</p>
  <ul *ngIf="data.length">
    <li *ngFor="let event of data">
      <div class="saved-event">
        <span *ngIf="event.date" class="saved-date">{{ event.date | date:'EEE, MMM d, y' }}</span>
        <strong>{{ event.name }}</strong>
        <span *ngIf="event.venue" class="saved-venue">{{ event.venue }}</span>
      </div>
      <button type="button" [attr.aria-label]="'Remove ' + event.name" (click)="removeFavourite(event)">
        Remove
      </button>
    </li>
  </ul>
</section>
