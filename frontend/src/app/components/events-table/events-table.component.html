  <div *ngIf="!eventDetails" class="container">
    <table class="table table-striped table-dark text-center" style="max-width: 800px; margin-left: auto; margin-right: auto; border-radius: 10px;">
      <thead>
        <tr>
          <th>Date/Time</th>
          <th>Icon</th>
          <th>Event</th>
          <th>Genre</th>
          <th>Venue</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let event of events">
          <td>{{ event.date + '\n' +event.time }}</td>
          <td>
            <img src="{{ event.icon }}" alt=" " class="custom-icon img-fluid" width="88.5" height="50">
          </td>
          <td><button type="button" class="btn btn-link text-white" (click)="clickEventName(event.event_id)">{{ event.name }}</button></td>
          <td>{{ event.genre }}</td>
          <td>{{ event.venue }}</td>
        </tr>
      </tbody>
    </table>
  </div>

  <p *ngIf="loading" class="text-center text-white" role="status">Loading event details…</p>
<p *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</p>
<app-details-card *ngIf="eventDetails" (closed)="closeDetails()" [event_details]="eventDetails"
  [artist_info]="artists" [venue_info]="venue"></app-details-card>
