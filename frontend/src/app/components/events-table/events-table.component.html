<section #resultRegion *ngIf="!eventDetails" aria-labelledby="results-heading">
  <h2 id="results-heading">{{ events.length }} {{ events.length === 1 ? 'event' : 'events' }}</h2>
  <ul class="result-list">
    <li *ngFor="let event of events">
      <button type="button" class="event-card" [attr.data-event-id]="event.event_id" (click)="clickEventName(event.event_id)">
        <div class="event-art">
          <img *ngIf="event.icon" [src]="event.icon" alt="" loading="lazy">
        </div>
        <div class="event-copy">
          <span class="event-date" *ngIf="event.date">{{ event.date | date:'EEE, MMM d, y' }}
            <span *ngIf="event.time"> · {{ event.time.slice(0, 5) }}</span>
          </span>
          <strong>{{ event.name }}</strong>
          <span class="event-venue" *ngIf="event.venue">{{ event.venue }}</span>
        </div>
      </button>
    </li>
  </ul>
</section>

<p *ngIf="loading" class="text-center" role="status">Loading event details…</p>
<p *ngIf="error" class="alert alert-danger" role="alert">{{ error }}</p>
<div *ngIf="eventDetails" #detailRegion tabindex="-1" class="detail-region" aria-label="Event details" role="region">
  <app-details-card (closed)="closeDetails()" [event_details]="eventDetails"
    [artist_info]="artists" [venue_info]="venue"></app-details-card>
</div>
