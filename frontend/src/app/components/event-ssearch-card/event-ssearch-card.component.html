<section class="search-panel" aria-labelledby="search-heading">
  <h1 id="search-heading">Find your next event</h1>
      <form id="event_form" (ngSubmit)="onSubmit()" ngNativeValidate>
        <div class="form-group">
          <label for="keyword">Artist, team, or event</label>
          <input type="text" id="keyword" name="keyword" class="form-control" placeholder="e.g. Coachella" matInput [(ngModel)]="keyword" (input)="auto_complete(keyword)" [matAutocomplete]="auto"  required>
          <mat-autocomplete #auto="matAutocomplete">
            <mat-option *ngFor="let suggestion of suggestions" [value]="suggestion">
              {{ suggestion }}
            </mat-option>
          </mat-autocomplete>
        </div>

        <div class="form-row">
          <div class="form-group col-md-6">
            <label for="distance">Distance (miles)</label>
            <input type="number" min="1" id="distance" [(ngModel)]="distance" name="distance" class="form-control" placeholder="10">
          </div>
          <div class="form-group col-md-6">
            <label for="category">Category</label>
            <select id="category" [(ngModel)]="category" name="category" class="form-control" required>
              <option value="default">All categories</option>
              <option value="music">Music</option>
              <option value="sports">Sports</option>
              <option value="art">Art</option>
              <option value="film">Film</option>
              <option value="miscellaneous">Miscellaneous</option>
            </select>
          </div>
        </div>

          <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" [ngModel]="location" (ngModelChange)="updateLocation($event)"
            name="location" class="form-control" matInput [matAutocomplete]="locationAuto"
            [disabled]="auto_detect" [placeholder]="locating ? 'Detecting location…' : 'City or ZIP code'" autocomplete="off" required>
          <mat-autocomplete #locationAuto="matAutocomplete">
            <mat-option *ngFor="let city of locationSuggestions" [value]="city">{{ city }}</mat-option>
          </mat-autocomplete>
          <p *ngIf="locating" class="text-white" role="status">Detecting your location…</p>
          <p *ngIf="locationError" class="alert alert-warning" role="alert">{{ locationError }}</p>
        </div>

        <div class="form-group form-check">
          <input type="checkbox" id="auto_detect" name="auto_detect" class="form-check-input" [ngModel]="auto_detect" (ngModelChange)="autoDetect($event)">
          <label class="form-check-label" for="auto_detect">Auto-detect your location</label>
        </div>

        <div class="search-actions">
          <button id="submit_button" type="submit" [disabled]="locating" class="search-submit">Search events</button>
          <button id="reset_button" type="button" class="search-clear" (click)="onClear()">Clear</button>
        </div>

      </form>
</section>
<p *ngIf="status === 'loading'" class="text-center text-white" role="status">Searching for events…</p>
<p *ngIf="status === 'error'" class="alert alert-danger" role="alert">{{ error }}</p>
<app-events-table *ngIf="events.length > 0" [events]="events"></app-events-table>
<app-no-events-table *ngIf="status === 'success' && events.length === 0" [showtable]="true"></app-no-events-table>
